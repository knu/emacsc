name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release asset
        run: |
          for command in emacsc dired ediff ediff-merge evil magit; do
            test -x "bin/$command"
          done
          sh -n bin/emacsc
          prove test/client.t
          for command in dired ediff ediff-merge evil magit; do
            perl -c "bin/$command"
          done
          bin/emacsc --version
          test -s lisp/emacsc.el

      - name: Package release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_dir=$(mktemp -d "$RUNNER_TEMP/package.XXXXXX")
          mkdir -p "$package_dir/bin" "$package_dir/share/emacs/site-lisp"
          install -m 755 bin/emacsc bin/dired bin/ediff bin/ediff-merge bin/evil bin/magit "$package_dir/bin/"
          install -m 644 lisp/emacsc.el "$package_dir/share/emacs/site-lisp/emacsc.el"
          cp LICENSE.txt "$package_dir/LICENSE.txt"
          tar -czf "$RUNNER_TEMP/emacsc-${TAG#v}.tar.gz" -C "$package_dir" bin LICENSE.txt share

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "$RUNNER_TEMP/emacsc-${TAG#v}.tar.gz" --verify-tag --title "$TAG" --notes-from-tag
